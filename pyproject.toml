[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scdpoc"
version = "0.1.0"
description = "EHDS Structured Clinical Document PoC: FHIR IPS preserved in a PDF/A-3 envelope, shared via IHE XDS.b and MHD, with an EHDS export preview. Synthetic data only."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "EHDS Structured Clinical Document PoC contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Development Status :: 3 - Alpha",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pikepdf>=9.0",
  "reportlab>=4.2",
  "pypdf>=5.0",
  "pyyaml>=6.0",
  "lxml>=5.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pip-audit>=2.7"]

[project.scripts]
scdpoc = "scdpoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scdpoc = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "verapdf: requires a veraPDF CLI or REST service (set SCDPOC_VERAPDF_CLI or SCDPOC_VERAPDF_URL)",
  "hl7validator: requires the HL7 FHIR validator (set SCDPOC_HL7_VALIDATOR_JAR)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
